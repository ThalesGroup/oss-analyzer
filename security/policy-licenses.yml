# =============================================================================
#  License lists — the allow / review / deny lists of oss-analyzer's default
#  policy, pulled in by policy-global.yml (licenses.lists_file), whose own
#  lists, if any, reclassify these.
#
#  A generic baseline of common licenses, classified on public criteria:
#    permissive, public domain           → allow
#    weak or strong copyleft,
#    source-available, field-of-use      → review   (decided case by case)
#    non-commercial                      → deny
#  It is a starting point, not legal advice: complete or replace it with
#  your organization's own decisions — here, or in a project's
#  policy-licenses.yml (see security/README.md, "Licenses"). A license
#  missing from these lists gets policy-global.yml's `unknown` verdict and
#  shows in the report's "Unclassified licenses".
#
#  Entries are sorted into the groups security/scripts/license_lists.py
#  reads back: keep each group comment as it is.
# =============================================================================

allow:
  # SPDX identifiers
  - "0BSD"
  - "Apache-2.0"
  - "BSD-1-Clause"
  - "BSD-2-Clause"
  - "BSD-3-Clause"
  - "CC-BY-3.0"
  - "CC-BY-4.0"
  - "CC0-1.0"
  - "ICU"
  - "ISC"
  - "MIT"
  - "WTFPL" # :-)
  - "X11"
  - "Zlib"
review:
  # SPDX identifiers
  - "CDDL-1.1"
  - "EPL-2.0"
  - "EUPL-1.1"
  - "EUPL-1.2"
  - "LGPL-2.0-only"
  - "LGPL-2.0-or-later"
  - "LGPL-2.1-only"
  - "LGPL-2.1-or-later"
  - "LGPL-3.0-only"
  - "LGPL-3.0-or-later"
  - "MPL-1.1"
  - "MPL-2.0"
  - "GPL-2.0-only"
  - "GPL-2.0-or-later"
  - "GPL-3.0-only"
  - "GPL-3.0-or-later"
  - "AGPL-3.0-only"
  - "AGPL-3.0-or-later"
  # SPDX expressions with an exception
  - "GPL-2.0-only WITH Classpath-exception-2.0"
  - "GPL-3.0-or-later WITH GCC-exception-3.1"
deny:
  # SPDX identifiers
  - "CC-BY-NC-1.0"
  - "CC-BY-NC-2.0"
  - "CC-BY-NC-2.5"
  - "CC-BY-NC-3.0"
  - "CC-BY-NC-4.0"
  - "CC-BY-NC-ND-1.0"
  - "CC-BY-NC-ND-2.0"
  - "CC-BY-NC-ND-2.5"
  - "CC-BY-NC-ND-3.0"
  - "CC-BY-NC-ND-4.0"
  - "CC-BY-NC-SA-1.0"
  - "CC-BY-NC-SA-2.0"
  - "CC-BY-NC-SA-2.5"
  - "CC-BY-NC-SA-3.0"
  - "CC-BY-NC-SA-4.0"
